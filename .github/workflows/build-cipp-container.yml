name: Build CIPP container

on:
  workflow_dispatch:
    inputs:
      publish_production_tag:
        description: Also publish the production tag
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "build/**"
      - ".dockerignore"
      - ".github/workflows/build-cipp-container.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: cipp-container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build and publish CIPP
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert image name to lowercase
        id: image
        shell: bash
        run: |
          IMAGE_NAME_LOWER="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME_LOWER}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=production,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_production_tag }}

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile.release
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## CIPP container build"
            echo
            echo "**Repository:** \`${GITHUB_REPOSITORY}\`"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "**Published image:** \`${REGISTRY}/${{ steps.image.outputs.name }}\`"
            echo
            echo "### Published tags"
            echo
            echo '```text'
            echo "${{ steps.metadata.outputs.tags }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
